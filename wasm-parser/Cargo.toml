[package]
name = "reader-wasm-parser"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sxd-xpath = "0.4"
sxd-document = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
